# Fixture catalog for extract-raw-preview.
#
# Single source of truth for test samples. Downloads land in
# test/fixtures/ (gitignored) and are pinned here by URL, byte size,
# and SHA-256 so a fetch either matches exactly or fails loudly.
#
# Add a format:
#   1. Add a key under `formats` (an empty list is enough to start).
#   2. Append at least one sample with a `decodable: true` preview.
#   3. `npm run fixtures` downloads it; `npm run fixtures:check` enforces the gate.
#
# Add a sample: append a mapping under that format. Required fields:
#   id, filename, url, bytes, sha256, license, source, previews
# Optional: note
#
# Each preview:
#   width, height, bytes
#   kind: strips | jpeg-interchange-format | header-jpeg | bmff-jpeg |
#         psd-resource | panasonic-jpgfromraw
#   jpeg: baseline | progressive | lossless
#   decodable: true | false

formats:
  tiff:
    - id: tiff-child-ifd
      filename: tiff-child-ifd.tiff
      url: https://raw.githubusercontent.com/python-pillow/Pillow/3078cab2618bf70537e5a1e646e156583af93ea3/Tests/images/child_ifd.tiff
